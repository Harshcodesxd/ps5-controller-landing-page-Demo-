<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PS5 Replicate</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="#" aria-label="PlayStation home">
        <img src="Assets/Svg/playstation-light.svg" alt="PlayStation" />
      </a>

      <nav class="nav-links" aria-label="Main">
        <a href="#">Games</a>
        <a href="#">Accessories</a>
        <a href="#">News</a>
        <a href="#">Store</a>
        <a href="#">Support</a>
      </nav>

      <div class="icon-bar">
        <button class="icon-btn" aria-label="Search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>

        <button class="icon-btn" aria-label="Cart">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 7h12l1 13H5L6 7z" />
            <path d="M9 7a3 3 0 0 1 6 0" />
          </svg>
        </button>

        <button class="icon-btn" aria-label="Account">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="info">
        <p>( PS5 CONTROLLER)</p>
        <h1>007 FIRST</h1>
        <h1>LIGHT</h1>

        <p>
          Style Power Precision Make your name and earn the number with the 007
          First Light limited edition DualSense controller
        </p>

        <button class="add2cart">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-shopping-cart preview-icon"
          >
            <path
              d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"
            />
            <path
              d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"
            />
            <circle cx="18" cy="20" r="2" />
            <circle cx="8" cy="20" r="2" />
          </svg>
          ADD TO CART
        </button>
        <span> ₹1,999 </span>
      </section>

      <section class="hero">
        <div id="gaming">GAMING</div>

        <img id="controller-img" src="Assets/007.png" alt="007" />

        <div id="glowing-ring"></div>
        <!-- glowing ring -->

        <div id="span-div">
          <span> </span>
          <span> </span>
          <span> </span>
        </div>
      </section>

      <section class="thumbs">
        <button id="genshin">
          <img id="genshin-img" src="Assets/genshin.png" alt="genshin" />
        </button>
        <button id="gow">
          <img id="gow-img" src="Assets/godofwar.png" alt="god of war" />
        </button>
      </section>
    </main>

    <footer class="footer">
      <a
        class="video-card"
        href="https://youtu.be/UShkCOZXMqI?si=XOsHxsqhhzwTGrVX"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="video-thumb"
          src="Assets/thumb-007.jpg"
          alt="Watch the 007 First Light trailer"
        />
        <img class="play-icon" src="Assets/Svg/play.svg" alt="" />
      </a>

      <div class="footer-btn">
        <button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-left preview-icon"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>
        <button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-right preview-icon"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </div>

      <div class="stats-card">
        <article>
          <p>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-battery-full preview-icon"
            >
              <path d="M10 10v4" />
              <path d="M14 10v4" />
              <path d="M22 14v-4" />
              <path d="M6 10v4" />
              <rect x="2" y="6" width="16" height="12" rx="2" />
            </svg>
          </p>
          <h1>12hr</h1>
          <p>Battery Life</p>
        </article>
        <article>
          <p>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-zap preview-icon"
            >
              <path
                d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"
              />
            </svg>
          </p>
          <h1>1ms</h1>
          <p>Low Latency</p>
        </article>
      </div>
    </footer>
  </body>
</html>
