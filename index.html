<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PS5 Replicate</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Permanent+Marker&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <header class="navbar">
    <a class="logo" href="#" aria-label="PlayStation home">
    <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 512 512"><path d="M511.4 341.8c-5.4-24.2-44-37.3-103.4-41.6-42.6-3-84.6 6.4-125.5 20.5l-6.4 2.3h-.1l.2-180.5c0-15.8 31.9-14.8 31.9 2.3v141.7c64.8 18.8 98-10.1 98.7-81.9.6-61.7-40.7-97-108.1-115.1l-105.4-28v214.8l-32.4 11h-.2L42.6 327.2c-.3 0-1 .3-1.7.3l70.9 22.6 81.5-29.2v30.2l-37.9 12.8-38.9 13.1c-25.2 8.7-46.6-11.7-23.5-20.1l18.8-6.7L41 327.7C19.2 335.1-1.3 350.9.1 373c1.3 22.5 52.7 27.9 92.3 34.2 36.9 6 70.4 2.7 100.9-8.1v24.5l82.6 26.9v-1.8l.7 1.8 72.2-25.2h-.1L468.5 383l1.3-.3c31.5-11.1 45-26.5 41.6-40.9m-120.8 17L276 398.1v-27.2l73.1-25.1.3.1 43-14.4c45-8.4 63.1 6.4 19.8 20.1l-21.2 7.3z" style="fill:currentColor"/></svg>
    </a>

    <nav class="nav-links" aria-label="Main">
      <a href="#">Games</a>
      <a href="#">Accessories</a>
      <a href="#">News</a>
      <a href="#">Store</a>
      <a href="#">Support</a>
    </nav>

    <div class="icon-bar">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>

      <button class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M6 7h12l1 13H5L6 7z" />
          <path d="M9 7a3 3 0 0 1 6 0" />
        </svg>
      </button>

      <button class="icon-btn" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <span class="vertical-label">( PS5 )</span>
    <section class="info">
      <p>( PS5 CONTROLLER )</p>
      <h1>007 FIRST</h1>
      <h1>LIGHT</h1>

      <p>
        Style Power Precision Make your name and earn the number with the 007
        First Light limited edition DualSense controller
      </p>

      <button class="add2cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-shopping-cart preview-icon">
          <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
          <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
          <circle cx="18" cy="20" r="2" />
          <circle cx="8" cy="20" r="2" />
        </svg>
        ADD TO CART
      </button>
      <span id="price"> ₹1,999 </span>
    </section>

    <section class="hero">
      <div id="gaming">GAMING</div>

      <img id="controller-img" src="Assets/007.png" alt="007" />

      <div id="ring-handle">
        <span>◀</span>
        <span>▶</span>
      </div>
      <div id="glowing-ring"></div>

      <!-- glowing ring -->


    </section>

    <section class="thumbs">
      <button class="thumb active" data-index="0">
        <img src="Assets/007.png" alt="007 First Light" />
      </button>
      <button class="thumb" data-index="1">
        <img src="Assets/genshin.png" alt="Genshin Impact" />
      </button>
      <button class="thumb" data-index="2">
        <img src="Assets/godofwar.png" alt="God of War" />
      </button>
    </section>
  </main>

  <footer class="footer">
    <a class="video-card" href="https://youtu.be/UShkCOZXMqI?si=XOsHxsqhhzwTGrVX" target="_blank"
      rel="noopener noreferrer">
      <img class="video-thumb" src="Assets/thumb-007.jpg" alt="Watch the 007 First Light trailer" />
      <img  class="play-icon" src="Assets/Svg/play.Svg" alt="" />
    </a>

    <div class="footer-btn">
   <div class="footer-controls">
  <div class="progress"><span class="progress-fill"></span></div>

  <div class="footer-btn">
    <button id="prev">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
    </button>
    <button id="next">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
   
    </div>

    <div class="stats-card">
      <article>
        <p>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-battery-full preview-icon">
            <path d="M10 10v4" />
            <path d="M14 10v4" />
            <path d="M22 14v-4" />
            <path d="M6 10v4" />
            <rect x="2" y="6" width="16" height="12" rx="2" />
          </svg>
        </p>
        <h1 id="stat1-value">12hr</h1>
        <p id="stat1-label">Battery Life</p>
      </article>
      <article>
        <p>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-zap preview-icon">
            <path
              d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" />
          </svg>
        </p>
        <h1 id="stat2-value">1ms</h1>
        <p id="stat2-label">Low Latency</p>
      </article>
    </div>
  </footer>

  
<script src="script.js"></script>
</body>

</html>
